<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980">
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:black}.t{font-size:26px;font-weight:bold}.s{font-size:19px;font-weight:bold}.n{font-size:16px}.b{fill:white;stroke:black;stroke-width:2}.bar{fill:white;stroke:black;stroke-width:2}.axis{stroke:black;stroke-width:2}.thin{stroke:black;stroke-width:1}</style>
<text x="750" y="40" text-anchor="middle" class="t">도 7. 본 발명의 성능 및 실행비용 효과 예시</text>
<text x="55" y="90" class="s">(a) 외부 비교 기법 대비 실행 유효성 및 작업 성공률</text>
<line x1="120" y1="390" x2="690" y2="390" class="axis"/><line x1="120" y1="135" x2="120" y2="390" class="axis"/>
<text x="105" y="395" text-anchor="end" class="n">0</text><text x="105" y="265" text-anchor="end" class="n">50</text><text x="105" y="145" text-anchor="end" class="n">100(%)</text>
<rect x="170" y="242" width="55" height="148" class="bar"/><rect x="235" y="212" width="55" height="178" class="bar"/><text x="230" y="415" text-anchor="middle" class="n">Direct</text><text x="197" y="232" text-anchor="middle" class="n">58.0</text><text x="262" y="202" text-anchor="middle" class="n">70.0</text>
<rect x="325" y="220" width="55" height="170" class="bar"/><rect x="390" y="212" width="55" height="178" class="bar"/><text x="385" y="415" text-anchor="middle" class="n">MIRROR-inspired</text><text x="352" y="210" text-anchor="middle" class="n">66.6</text><text x="417" y="202" text-anchor="middle" class="n">70.0</text>
<rect x="500" y="220" width="55" height="170" class="bar"/><rect x="565" y="212" width="55" height="178" class="bar"/><text x="560" y="415" text-anchor="middle" class="n">Tool-MVR-inspired</text><text x="527" y="210" text-anchor="middle" class="n">66.6</text><text x="592" y="202" text-anchor="middle" class="n">70.0</text>
<rect x="675" y="178" width="55" height="212" class="bar"/><rect x="740" y="157" width="55" height="233" class="bar"/><text x="735" y="415" text-anchor="middle" class="n">Proposed</text><text x="702" y="168" text-anchor="middle" class="n">83.2</text><text x="767" y="147" text-anchor="middle" class="n">91.4</text>
<rect x="850" y="145" width="28" height="18" class="bar"/><text x="890" y="160" class="n">OEPVR</text><rect x="850" y="180" width="28" height="18" class="bar"/><line x1="850" y1="189" x2="878" y2="189" class="thin"/><text x="890" y="195" class="n">TSR</text>
<text x="55" y="490" class="s">(b) 모든 위반 보완(Strict) 대비 선택적 보완 효과</text>
<rect x="85" y="535" width="390" height="150" rx="8" class="b"/><text x="280" y="570" text-anchor="middle" class="s">보완 수행률</text><text x="280" y="610" text-anchor="middle" class="n">Strict: 100.0%</text><text x="280" y="642" text-anchor="middle" class="n">Proposed: 47.3%</text><text x="280" y="670" text-anchor="middle" class="n">→ 52.7%p 감소</text>
<rect x="555" y="535" width="390" height="150" rx="8" class="b"/><text x="750" y="570" text-anchor="middle" class="s">평균 추가 지연시간</text><text x="750" y="610" text-anchor="middle" class="n">Strict: 53.7 ms</text><text x="750" y="642" text-anchor="middle" class="n">Proposed: 43.7 ms</text><text x="750" y="670" text-anchor="middle" class="n">→ 약 18.6% 감소</text>
<rect x="1025" y="535" width="390" height="150" rx="8" class="b"/><text x="1220" y="570" text-anchor="middle" class="s">평균 도구 호출 수</text><text x="1220" y="610" text-anchor="middle" class="n">Strict: 7.426</text><text x="1220" y="642" text-anchor="middle" class="n">Proposed: 7.366</text><text x="1220" y="670" text-anchor="middle" class="n">→ 동일 성능에서 호출 감소</text>
<text x="55" y="760" class="s">(c) 비용 고려 후보 선택의 효과</text>
<rect x="250" y="805" width="1000" height="115" rx="8" class="b"/><text x="750" y="840" text-anchor="middle" class="s">Risk-only vs. Risk-Cost</text><text x="750" y="875" text-anchor="middle" class="n">TSR: 91.4%로 동일 / 평균 추가 지연시간: 53.9 ms → 43.7 ms</text><text x="750" y="903" text-anchor="middle" class="n">→ 동일 작업 성공률을 유지하면서 약 18.9%의 추가 지연시간 감소</text>
