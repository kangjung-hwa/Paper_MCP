<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:black}.t{font-size:25px;font-weight:bold}.s{font-size:18px}.n{font-size:16px}.b{fill:white;stroke:black;stroke-width:2}.d{fill:white;stroke:black;stroke-width:2;stroke-dasharray:7 5}.l{stroke:black;stroke-width:2;fill:none;marker-end:url(#a)}</style>
<text x="700" y="38" text-anchor="middle" class="t">도 4. 선택적 보완 후보 생성 및 최적화 구조</text>
<rect x="70" y="95" width="250" height="90" rx="8" class="b"/><text x="195" y="130" text-anchor="middle" class="s">실행계획 위험도</text><text x="195" y="160" text-anchor="middle" class="n">R(W) (162)</text>
<polygon points="470,92 610,140 470,188 330,140" class="b"/><text x="470" y="132" text-anchor="middle" class="s">R(W) &gt; θ ?</text><text x="470" y="158" text-anchor="middle" class="n">보완 결정부 (170)</text>
<path d="M320 140 H330" class="l"/>
<rect x="730" y="85" width="260" height="100" rx="8" class="b"/><text x="860" y="122" text-anchor="middle" class="s">초기 실행계획 유지</text><text x="860" y="150" text-anchor="middle" class="n">보완 없음</text><path d="M610 140 H730" class="l"/><text x="670" y="128" text-anchor="middle" class="n">아니오</text>
<rect x="310" y="275" width="320" height="100" rx="8" class="b"/><text x="470" y="310" text-anchor="middle" class="s">위험 기여 실행조건 식별</text><text x="470" y="340" text-anchor="middle" class="n">위반조건 식별정보 (181)</text><path d="M470 188 V275" class="l"/><text x="490" y="235" class="n">예</text>
<rect x="310" y="425" width="320" height="115" rx="8" class="b"/><text x="470" y="458" text-anchor="middle" class="s">보완 후보 생성부 (180)</text><text x="470" y="488" text-anchor="middle" class="n">변환 / 갱신 / 보강 / 검증</text><text x="470" y="516" text-anchor="middle" class="n">후보 집합 R = {r1,r2,…} (182)</text><path d="M470 375 V425" class="l"/>
<rect x="760" y="285" width="500" height="250" rx="8" class="d"/><text x="1010" y="320" text-anchor="middle" class="s">후보별 가상 적용 및 평가</text><text x="1010" y="358" text-anchor="middle" class="n">후보 r1 → 잔여 위험도 R(W⊕r1), 비용 C(r1)</text><text x="1010" y="393" text-anchor="middle" class="n">후보 r2 → 잔여 위험도 R(W⊕r2), 비용 C(r2)</text><text x="1010" y="428" text-anchor="middle" class="n">후보 rn → 잔여 위험도 R(W⊕rn), 비용 C(rn)</text><text x="1010" y="480" text-anchor="middle" class="n">C(r): 지연시간·호출 수·자원비용 등</text><path d="M630 482 H760" class="l"/>
<rect x="450" y="630" width="500" height="110" rx="8" class="b"/><text x="700" y="665" text-anchor="middle" class="s">보완 최적화부 (190)</text><text x="700" y="697" text-anchor="middle" class="n">J(r) = R(W⊕r) + λC(r)</text><text x="700" y="724" text-anchor="middle" class="n">위험 감소 후보 중 arg min J(r)</text><path d="M1010 535 V585 H700 V630" class="l"/>
<rect x="1040" y="630" width="280" height="110" rx="8" class="b"/><text x="1180" y="660" text-anchor="middle" class="s">실행계획 갱신 및 재검증부</text><text x="1180" y="690" text-anchor="middle" class="n">선택 후보 r* 삽입 (200)</text><text x="1180" y="720" text-anchor="middle" class="n">잔여 위험도 재산출</text><path d="M950 685 H1040" class="l"/>
<path d="M1180 630 V575 H220 V140 H330" class="l"/><text x="330" y="568" class="n">필요 시 반복 보완</text>
