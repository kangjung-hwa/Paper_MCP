<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .panel{stroke-width:2.2;rx:14;ry:14}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.8;rx:9;ry:9}
      .num{font:700 28px 'Times New Roman',serif;fill:#ffffff}
      .head{font:700 29px 'Times New Roman',serif;fill:#0f172a}
      .main{font:400 24px 'Times New Roman',serif;fill:#111827}
      .small{font:400 19px 'Times New Roman',serif;fill:#111827}
      .math{font:italic 24px 'Times New Roman',serif;fill:#111827}
      .line{stroke:#1f2937;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
      .dash{fill:#ffffff;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 6;rx:7;ry:7}
    </style>
  </defs>

  <!-- Inputs -->
  <rect x="25" y="235" width="145" height="90" class="box"/>
  <text x="97" y="273" text-anchor="middle" class="main">User</text>
  <text x="97" y="303" text-anchor="middle" class="main">Request</text>
  <rect x="25" y="370" width="145" height="90" class="box"/>
  <text x="97" y="408" text-anchor="middle" class="main">Tool</text>
  <text x="97" y="438" text-anchor="middle" class="main">Registry</text>

  <!-- Stage 1 -->
  <rect x="205" y="165" width="315" height="365" class="panel" fill="#eef5fb" stroke="#5f7893"/>
  <circle cx="362" cy="150" r="31" fill="#506f90"/>
  <text x="362" y="159" text-anchor="middle" class="num">1</text>
  <text x="362" y="208" text-anchor="middle" class="head">Plan Generation</text>
  <rect x="242" y="255" width="240" height="88" class="box"/>
  <text x="362" y="308" text-anchor="middle" class="main">Tool Selection</text>
  <rect x="242" y="382" width="240" height="100" class="box"/>
  <text x="362" y="424" text-anchor="middle" class="main">Dependency</text>
  <text x="362" y="455" text-anchor="middle" class="main">Construction</text>

  <!-- Initial plan -->
  <rect x="555" y="280" width="150" height="130" class="box"/>
  <text x="630" y="322" text-anchor="middle" class="main">Initial</text>
  <text x="630" y="353" text-anchor="middle" class="main">Plan</text>
  <text x="630" y="389" text-anchor="middle" class="math">W</text>

  <!-- Stage 2 -->
  <rect x="745" y="120" width="420" height="455" class="panel" fill="#fbf6ec" stroke="#a58a5d"/>
  <circle cx="955" cy="105" r="31" fill="#a17c3f"/>
  <text x="955" y="114" text-anchor="middle" class="num">2</text>
  <text x="955" y="163" text-anchor="middle" class="head">Risk Assessment</text>

  <rect x="785" y="205" width="340" height="155" class="box"/>
  <text x="955" y="240" text-anchor="middle" class="main">Execution Conditions Check</text>
  <rect x="805" y="265" width="300" height="75" class="dash"/>
  <text x="955" y="292" text-anchor="middle" class="small">Schema Type · Semantic Type · Unit</text>
  <text x="955" y="321" text-anchor="middle" class="small">Reference Frame · Freshness · Confidence · Provenance</text>

  <rect x="785" y="400" width="340" height="105" class="box"/>
  <text x="955" y="438" text-anchor="middle" class="main">Risk Estimation</text>
  <text x="955" y="478" text-anchor="middle" class="math">Dᵢⱼ, Rᵢⱼ, R(W)</text>

  <!-- Decision -->
  <polygon points="1260,265 1340,345 1260,425 1180,345" fill="#f8fafc" stroke="#475569" stroke-width="2.2"/>
  <text x="1260" y="338" text-anchor="middle" class="math">R(W) &gt; θ</text>
  <text x="1260" y="371" text-anchor="middle" class="main">?</text>

  <!-- Stage 3 -->
  <rect x="1090" y="505" width="430" height="170" class="panel" fill="#fbf0f2" stroke="#a66d78"/>
  <circle cx="1305" cy="490" r="31" fill="#9a5f69"/>
  <text x="1305" y="499" text-anchor="middle" class="num">3</text>
  <text x="1305" y="548" text-anchor="middle" class="head">Selective Repair</text>
  <rect x="1120" y="575" width="125" height="70" class="box"/>
  <text x="1182" y="603" text-anchor="middle" class="small">Candidate</text>
  <text x="1182" y="628" text-anchor="middle" class="small">Generation</text>
  <rect x="1260" y="575" width="125" height="70" class="box"/>
  <text x="1322" y="603" text-anchor="middle" class="small">Residual Risk</text>
  <text x="1322" y="628" text-anchor="middle" class="small">+ Cost</text>
  <rect x="1400" y="575" width="90" height="70" class="box"/>
  <text x="1445" y="603" text-anchor="middle" class="small">Select</text>
  <text x="1445" y="630" text-anchor="middle" class="math">r*</text>

  <!-- Final plan -->
  <rect x="1410" y="260" width="165" height="125" class="box"/>
  <text x="1492" y="307" text-anchor="middle" class="main">Final Plan</text>
  <text x="1492" y="345" text-anchor="middle" class="math">W or W⊕r*</text>

  <!-- Main flow -->
  <line x1="170" y1="280" x2="205" y2="280" class="line"/>
  <line x1="170" y1="415" x2="205" y2="415" class="line"/>
  <line x1="482" y1="299" x2="555" y2="322" class="line"/>
  <line x1="482" y1="432" x2="555" y2="370" class="line"/>
  <line x1="705" y1="345" x2="745" y2="345" class="line"/>
  <line x1="1165" y1="345" x2="1180" y2="345" class="line"/>

  <!-- Decision branches -->
  <line x1="1340" y1="345" x2="1410" y2="322" class="line"/>
  <text x="1370" y="322" class="small">No</text>
  <path d="M1260 425 L1260 505" class="line"/>
  <text x="1280" y="470" class="small">Yes</text>

  <!-- Repair internal flow -->
  <line x1="1245" y1="610" x2="1260" y2="610" class="thin"/>
  <line x1="1385" y1="610" x2="1400" y2="610" class="thin"/>

  <!-- Re-check loop -->
  <path d="M1445 575 L1445 555 L1060 555 L1060 520 L955 520 L955 505" class="line"/>
  <text x="1185" y="543" text-anchor="middle" class="small">Re-check</text>
</svg>
