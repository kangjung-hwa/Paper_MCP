<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:3;rx:14;ry:14}.small{fill:#fff;stroke:#111;stroke-width:2;rx:10;ry:10}.title{font:700 34px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}.main{font:700 26px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}.sub{font:400 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}.tiny{font:400 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}.line{stroke:#111;stroke-width:4;fill:none;marker-end:url(#arrow)}.loop{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <text x="800" y="58" text-anchor="middle" class="title">제안하는 위험도 기반 MCP AI 에이전트 오케스트레이션 구조</text>

  <rect x="45" y="180" width="220" height="90" class="box"/><text x="155" y="234" text-anchor="middle" class="main">사용자 요청</text>
  <rect x="45" y="300" width="220" height="90" class="box"/><text x="155" y="340" text-anchor="middle" class="main">도구 정보</text><text x="155" y="370" text-anchor="middle" class="sub">(도구 레지스트리)</text>

  <rect x="340" y="230" width="240" height="120" class="box"/><text x="460" y="285" text-anchor="middle" class="main">초기 실행계획 생성</text><text x="460" y="320" text-anchor="middle" class="sub">Planning</text>

  <rect x="655" y="200" width="310" height="140" class="box"/><text x="810" y="258" text-anchor="middle" class="main">실행조건 검증 및</text><text x="810" y="292" text-anchor="middle" class="main">위험도 산정</text><text x="810" y="325" text-anchor="middle" class="sub">Validation &amp; Risk Assessment</text>
  <rect x="655" y="360" width="310" height="70" class="small"/><text x="810" y="388" text-anchor="middle" class="tiny">Schema / Semantic / Unit / Frame</text><text x="810" y="414" text-anchor="middle" class="tiny">Freshness / Confidence / Provenance</text>

  <polygon points="1070,210 1130,270 1070,330 1010,270" fill="#fff" stroke="#111" stroke-width="3"/><text x="1070" y="262" text-anchor="middle" class="sub">위험도 &gt;</text><text x="1070" y="286" text-anchor="middle" class="sub">임계값?</text>

  <rect x="1210" y="170" width="330" height="135" class="box"/><text x="1375" y="225" text-anchor="middle" class="main">선택적 보완 및 후보 선택</text><text x="1375" y="268" text-anchor="middle" class="sub">Selective Repair</text>
  <rect x="1210" y="325" width="330" height="85" class="small"/><text x="1375" y="355" text-anchor="middle" class="sub">Residual Risk + Cost</text><text x="1375" y="385" text-anchor="middle" class="tiny">(추가 지연시간, 도구 호출 수 고려)</text>

  <rect x="1180" y="465" width="300" height="95" class="box"/><text x="1330" y="505" text-anchor="middle" class="main">수정된 실행계획</text><text x="1330" y="535" text-anchor="middle" class="sub">Final Execution Plan</text>

  <line x1="265" y1="225" x2="340" y2="255" class="line"/><line x1="265" y1="345" x2="340" y2="315" class="line"/><line x1="580" y1="290" x2="655" y2="290" class="line"/><line x1="965" y1="270" x2="1010" y2="270" class="line"/>
  <line x1="1130" y1="270" x2="1210" y2="237" class="line"/><text x="1170" y="232" text-anchor="middle" class="tiny">예</text>
  <path d="M1070 330 L1070 512 L1180 512" class="line"/><text x="1110" y="495" text-anchor="middle" class="tiny">아니오</text>
  <line x1="1375" y1="410" x2="1375" y2="465" class="line"/>
  <path d="M1210 215 L1180 215 L1180 120 L810 120 L810 200" class="loop"/><text x="995" y="108" text-anchor="middle" class="tiny">재검증</text>

  <text x="800" y="602" text-anchor="middle" class="tiny">초기 실행계획을 생성한 뒤 실행조건을 검증하고, 위험도가 임계값을 초과한 경우에만 보완 후보를 선택하여 수정된 실행계획을 산출한다.</text>
</svg>
