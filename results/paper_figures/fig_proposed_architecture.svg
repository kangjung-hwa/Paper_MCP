<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker>
    <style>
      .group{fill:#fff;stroke:#111;stroke-width:3;rx:16;ry:16}
      .box{fill:#fff;stroke:#111;stroke-width:2.5;rx:10;ry:10}
      .subbox{fill:#fff;stroke:#555;stroke-width:1.8;rx:8;ry:8}
      .head{font:700 27px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}
      .main{font:700 23px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}
      .sub{font:400 18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}
      .tiny{font:400 16px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#111}
      .line{stroke:#111;stroke-width:3.5;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <!-- Inputs -->
  <rect x="35" y="215" width="210" height="90" class="box"/>
  <text x="140" y="268" text-anchor="middle" class="main">사용자 요청</text>
  <rect x="35" y="355" width="210" height="105" class="box"/>
  <text x="140" y="397" text-anchor="middle" class="main">도구 정보</text>
  <text x="140" y="430" text-anchor="middle" class="sub">Tool Registry</text>

  <!-- Planning -->
  <rect x="310" y="180" width="270" height="315" class="group"/>
  <text x="445" y="222" text-anchor="middle" class="head">실행계획 생성</text>
  <rect x="345" y="265" width="200" height="110" class="box"/>
  <text x="445" y="308" text-anchor="middle" class="main">초기 실행계획</text>
  <text x="445" y="340" text-anchor="middle" class="sub">W 생성</text>
  <rect x="345" y="405" width="200" height="55" class="subbox"/>
  <text x="445" y="439" text-anchor="middle" class="tiny">도구 선택 · 순서 · 의존관계</text>

  <!-- Risk assessment -->
  <rect x="645" y="90" width="475" height="545" class="group"/>
  <text x="882" y="132" text-anchor="middle" class="head">실행조건 평가 및 위험도 산정</text>
  <rect x="685" y="175" width="395" height="72" class="box"/>
  <text x="882" y="219" text-anchor="middle" class="main">도구 간 의존관계별 실행조건 비교</text>
  <rect x="685" y="275" width="395" height="78" class="subbox"/>
  <text x="882" y="305" text-anchor="middle" class="tiny">Schema · Semantic · Unit · Reference Frame</text>
  <text x="882" y="334" text-anchor="middle" class="tiny">Freshness · Confidence · Provenance</text>
  <rect x="685" y="385" width="180" height="78" class="box"/>
  <text x="775" y="415" text-anchor="middle" class="main">조건 결손도</text>
  <text x="775" y="446" text-anchor="middle" class="sub">Dᵢⱼ</text>
  <rect x="900" y="385" width="180" height="78" class="box"/>
  <text x="990" y="415" text-anchor="middle" class="main">의존관계 위험도</text>
  <text x="990" y="446" text-anchor="middle" class="sub">Rᵢⱼ</text>
  <rect x="795" y="500" width="180" height="78" class="box"/>
  <text x="885" y="530" text-anchor="middle" class="main">실행계획 위험도</text>
  <text x="885" y="561" text-anchor="middle" class="sub">R(W)</text>

  <!-- Decision -->
  <polygon points="1195,275 1265,345 1195,415 1125,345" fill="#fff" stroke="#111" stroke-width="3"/>
  <text x="1195" y="337" text-anchor="middle" class="sub">R(W) &gt; θ</text>
  <text x="1195" y="365" text-anchor="middle" class="sub">?</text>

  <!-- Selective repair -->
  <rect x="1310" y="90" width="255" height="545" class="group"/>
  <text x="1438" y="132" text-anchor="middle" class="head">선택적 보완</text>
  <rect x="1340" y="185" width="195" height="78" class="box"/>
  <text x="1438" y="215" text-anchor="middle" class="main">보완 후보 생성</text>
  <text x="1438" y="245" text-anchor="middle" class="tiny">실행조건 기반</text>
  <rect x="1340" y="305" width="195" height="100" class="box"/>
  <text x="1438" y="337" text-anchor="middle" class="main">후보 평가</text>
  <text x="1438" y="367" text-anchor="middle" class="tiny">잔여 위험도 + 비용</text>
  <text x="1438" y="392" text-anchor="middle" class="tiny">지연시간 · 호출 수</text>
  <rect x="1340" y="445" width="195" height="80" class="box"/>
  <text x="1438" y="476" text-anchor="middle" class="main">최종 후보 선택</text>
  <text x="1438" y="507" text-anchor="middle" class="sub">r*</text>
  <rect x="1340" y="555" width="195" height="55" class="subbox"/>
  <text x="1438" y="589" text-anchor="middle" class="tiny">보완 후 재검증</text>

  <!-- Output -->
  <rect x="1085" y="655" width="320" height="75" class="box"/>
  <text x="1245" y="701" text-anchor="middle" class="main">최종 실행계획</text>

  <!-- Connections -->
  <line x1="245" y1="260" x2="310" y2="285" class="line"/>
  <line x1="245" y1="407" x2="310" y2="390" class="line"/>
  <line x1="580" y1="335" x2="645" y2="335" class="line"/>
  <line x1="882" y1="247" x2="882" y2="275" class="line"/>
  <line x1="882" y1="353" x2="775" y2="385" class="line"/>
  <line x1="865" y1="424" x2="900" y2="424" class="line"/>
  <line x1="990" y1="463" x2="920" y2="500" class="line"/>
  <line x1="975" y1="539" x2="1125" y2="365" class="line"/>
  <line x1="1265" y1="345" x2="1310" y2="345" class="line"/>
  <text x="1286" y="329" text-anchor="middle" class="tiny">예</text>
  <path d="M1195 415 L1195 655" class="line"/>
  <text x="1217" y="525" class="tiny">아니오</text>
  <line x1="1438" y1="263" x2="1438" y2="305" class="line"/>
  <line x1="1438" y1="405" x2="1438" y2="445" class="line"/>
  <line x1="1438" y1="525" x2="1438" y2="555" class="line"/>
  <path d="M1340 582 L1285 582 L1285 610 L975 610 L975 578" class="loop"/>
  <line x1="1438" y1="610" x2="1405" y2="655" class="line"/>
</svg>
