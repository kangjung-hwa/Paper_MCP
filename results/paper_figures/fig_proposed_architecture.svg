<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .panel{stroke-width:1.8}
      .box{fill:#ffffff;stroke:#334155;stroke-width:1.6}
      .dash{fill:#ffffff;stroke:#94a3b8;stroke-width:1.4;stroke-dasharray:6 5}
      .num{font:700 28px 'Times New Roman',serif;fill:#ffffff;text-anchor:middle}
      .head{font:700 32px 'Times New Roman',serif;fill:#0f172a;text-anchor:middle}
      .main{font:400 27px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .small{font:400 21px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .math{font:italic 27px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .line{stroke:#1f2937;stroke-width:2.3;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#475569;stroke-width:1.8;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="18" y="165" width="100" height="82" class="box"/>
  <text x="68" y="198" class="main"><tspan x="68">User</tspan><tspan x="68" dy="29">Request</tspan></text>
  <rect x="18" y="285" width="100" height="82" class="box"/>
  <text x="68" y="318" class="main"><tspan x="68">Tool</tspan><tspan x="68" dy="29">Registry</tspan></text>

  <!-- Stage 1 -->
  <rect x="145" y="115" width="210" height="290" fill="#eef5fb" stroke="#5f7893" class="panel"/>
  <circle cx="250" cy="115" r="26" fill="#506f90"/>
  <text x="250" y="124" class="num">1</text>
  <text x="250" y="160" class="head">Plan Generation</text>
  <rect x="170" y="200" width="160" height="70" class="box"/>
  <text x="250" y="244" class="main">Tool Selection</text>
  <rect x="170" y="300" width="160" height="78" class="box"/>
  <text x="250" y="329" class="main"><tspan x="250">Dependency</tspan><tspan x="250" dy="29">Construction</tspan></text>

  <!-- Initial plan -->
  <rect x="385" y="205" width="105" height="120" class="box"/>
  <text x="437" y="242" class="main"><tspan x="437">Initial</tspan><tspan x="437" dy="29">Plan</tspan></text>
  <text x="437" y="304" class="math">W</text>

  <!-- Stage 2 -->
  <rect x="520" y="80" width="330" height="355" fill="#fbf6ec" stroke="#a58a5d" class="panel"/>
  <circle cx="685" cy="80" r="26" fill="#a17c3f"/>
  <text x="685" y="89" class="num">2</text>
  <text x="685" y="125" class="head">Risk Assessment</text>

  <rect x="545" y="165" width="280" height="145" class="box"/>
  <text x="685" y="199" class="main">Execution Conditions Check</text>
  <rect x="560" y="220" width="250" height="72" class="dash"/>
  <text x="685" y="242" class="small"><tspan x="685">Schema Type · Semantic Type · Unit</tspan><tspan x="685" dy="24">Reference Frame · Freshness</tspan><tspan x="685" dy="24">Confidence · Provenance</tspan></text>

  <rect x="545" y="335" width="280" height="78" class="box"/>
  <text x="685" y="365" class="main">Risk Estimation</text>
  <text x="685" y="399" class="math">Dᵢⱼ, Rᵢⱼ, R(W)</text>

  <!-- Decision -->
  <polygon points="930,185 995,250 930,315 865,250" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/>
  <text x="930" y="245" class="math">R(W) &gt; θ?</text>

  <!-- Final plan -->
  <rect x="1035" y="190" width="145" height="120" class="box"/>
  <text x="1107" y="231" class="main">Final Plan</text>
  <text x="1107" y="273" class="math">W or W⊕r*</text>

  <!-- Stage 3 -->
  <rect x="720" y="410" width="460" height="125" fill="#fbf0f2" stroke="#a66d78" class="panel"/>
  <circle cx="950" cy="410" r="26" fill="#9a5f69"/>
  <text x="950" y="419" class="num">3</text>
  <text x="950" y="455" class="head">Selective Repair</text>

  <rect x="745" y="477" width="125" height="44" class="box"/>
  <text x="807" y="495" class="small"><tspan x="807">Candidate</tspan><tspan x="807" dy="21">Generation</tspan></text>
  <rect x="885" y="477" width="135" height="44" class="box"/>
  <text x="952" y="495" class="small"><tspan x="952">Residual Risk</tspan><tspan x="952" dy="21">+ Cost</tspan></text>
  <rect x="1035" y="477" width="120" height="44" class="box"/>
  <text x="1095" y="495" class="small"><tspan x="1095">Select</tspan><tspan x="1095" dy="21">r*</tspan></text>

  <!-- Main flow -->
  <line x1="118" y1="206" x2="145" y2="206" class="line"/>
  <line x1="118" y1="326" x2="145" y2="326" class="line"/>
  <line x1="330" y1="235" x2="385" y2="245" class="line"/>
  <line x1="330" y1="339" x2="385" y2="290" class="line"/>
  <line x1="490" y1="265" x2="520" y2="265" class="line"/>
  <line x1="850" y1="250" x2="865" y2="250" class="line"/>

  <!-- Decision branches -->
  <line x1="995" y1="250" x2="1035" y2="250" class="line"/>
  <text x="1017" y="228" class="small">No</text>
  <path d="M930 315 L930 410" class="line"/>
  <text x="954" y="360" class="small">Yes</text>

  <!-- Repair internal flow -->
  <line x1="870" y1="499" x2="885" y2="499" class="thin"/>
  <line x1="1020" y1="499" x2="1035" y2="499" class="thin"/>

  <!-- Re-check loop -->
  <path d="M1095 477 L1095 445 L860 445 L860 392 L825 392" class="line"/>
  <text x="980" y="437" class="small">Re-check</text>
</svg>