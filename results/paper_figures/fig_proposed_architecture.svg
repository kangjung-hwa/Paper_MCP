<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <style>
      .panel{stroke-width:2.2;fill:#fff}
      .box{fill:#fff;stroke:#334155;stroke-width:1.9}
      .dash{fill:#fff;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:7 6}
      .num{font:700 30px 'Times New Roman',serif;fill:#fff;text-anchor:middle}
      .head{font:700 31px 'Times New Roman',serif;fill:#0f172a;text-anchor:middle}
      .main{font:400 25px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .small{font:400 20px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .math{font:italic 26px 'Times New Roman',serif;fill:#111827;text-anchor:middle}
      .line{stroke:#1f2937;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="700" fill="#ffffff"/>

  <!-- Inputs -->
  <rect x="35" y="210" width="145" height="90" class="box"/>
  <text x="107" y="247" class="main"><tspan x="107">User</tspan><tspan x="107" dy="30">Request</tspan></text>
  <rect x="35" y="350" width="145" height="90" class="box"/>
  <text x="107" y="387" class="main"><tspan x="107">Tool</tspan><tspan x="107" dy="30">Registry</tspan></text>

  <!-- Stage 1 -->
  <rect x="220" y="145" width="300" height="360" fill="#eef5fb" stroke="#5f7893" class="panel"/>
  <circle cx="370" cy="145" r="30" fill="#506f90"/>
  <text x="370" y="155" class="num">1</text>
  <text x="370" y="195" class="head">Plan Generation</text>
  <rect x="255" y="245" width="230" height="90" class="box"/>
  <text x="370" y="300" class="main">Tool Selection</text>
  <rect x="255" y="370" width="230" height="100" class="box"/>
  <text x="370" y="410" class="main"><tspan x="370">Dependency</tspan><tspan x="370" dy="31">Construction</tspan></text>

  <!-- Initial plan -->
  <rect x="555" y="260" width="145" height="135" class="box"/>
  <text x="627" y="304" class="main"><tspan x="627">Initial</tspan><tspan x="627" dy="30">Plan</tspan></text>
  <text x="627" y="375" class="math">W</text>

  <!-- Stage 2 -->
  <rect x="745" y="105" width="455" height="430" fill="#fbf6ec" stroke="#a58a5d" class="panel"/>
  <circle cx="972" cy="105" r="30" fill="#a17c3f"/>
  <text x="972" y="115" class="num">2</text>
  <text x="972" y="155" class="head">Risk Assessment</text>

  <rect x="780" y="205" width="385" height="170" class="box"/>
  <text x="972" y="242" class="main">Execution Conditions Check</text>
  <rect x="800" y="265" width="345" height="90" class="dash"/>
  <text x="972" y="291" class="small">
    <tspan x="972">Schema Type · Semantic Type · Unit</tspan>
    <tspan x="972" dy="26">Reference Frame · Freshness</tspan>
    <tspan x="972" dy="26">Confidence · Provenance</tspan>
  </text>

  <rect x="780" y="405" width="385" height="95" class="box"/>
  <text x="972" y="441" class="main">Risk Estimation</text>
  <text x="972" y="480" class="math">Dᵢⱼ, Rᵢⱼ, R(W)</text>

  <!-- Decision -->
  <polygon points="1310,235 1390,315 1310,395 1230,315" fill="#f8fafc" stroke="#475569" stroke-width="2.2"/>
  <text x="1310" y="309" class="math">R(W) &gt; θ</text>
  <text x="1310" y="344" class="main">?</text>

  <!-- Final plan -->
  <rect x="1430" y="245" width="145" height="140" class="box"/>
  <text x="1502" y="295" class="main">Final Plan</text>
  <text x="1502" y="340" class="math">W or W⊕r*</text>

  <!-- Stage 3 -->
  <rect x="930" y="555" width="610" height="125" fill="#fbf0f2" stroke="#a66d78" class="panel"/>
  <circle cx="1235" cy="555" r="30" fill="#9a5f69"/>
  <text x="1235" y="565" class="num">3</text>
  <text x="1235" y="602" class="head">Selective Repair</text>

  <rect x="960" y="620" width="165" height="48" class="box"/>
  <text x="1042" y="639" class="small"><tspan x="1042">Candidate</tspan><tspan x="1042" dy="22">Generation</tspan></text>
  <rect x="1145" y="620" width="180" height="48" class="box"/>
  <text x="1235" y="639" class="small"><tspan x="1235">Residual Risk</tspan><tspan x="1235" dy="22">+ Cost</tspan></text>
  <rect x="1345" y="620" width="165" height="48" class="box"/>
  <text x="1427" y="639" class="small"><tspan x="1427">Select</tspan><tspan x="1427" dy="22">r*</tspan></text>

  <!-- Main flow -->
  <line x1="180" y1="255" x2="220" y2="255" class="line"/>
  <line x1="180" y1="395" x2="220" y2="395" class="line"/>
  <line x1="485" y1="290" x2="555" y2="300" class="line"/>
  <line x1="485" y1="420" x2="555" y2="355" class="line"/>
  <line x1="700" y1="327" x2="745" y2="327" class="line"/>
  <line x1="1200" y1="315" x2="1230" y2="315" class="line"/>

  <!-- Decision branches -->
  <line x1="1390" y1="315" x2="1430" y2="315" class="line"/>
  <text x="1410" y="290" class="small">No</text>
  <path d="M1310 395 L1310 555" class="line"/>
  <text x="1336" y="475" class="small">Yes</text>

  <!-- Repair internal flow -->
  <line x1="1125" y1="644" x2="1145" y2="644" class="thin"/>
  <line x1="1325" y1="644" x2="1345" y2="644" class="thin"/>

  <!-- Re-check loop -->
  <path d="M1427 620 L1427 590 L900 590 L900 500" class="line"/>
  <text x="1160" y="580" class="small">Re-check</text>
</svg>