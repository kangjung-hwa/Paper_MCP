<svg xmlns="http://www.w3.org/2000/svg" width="75mm" height="44mm" viewBox="0 0 1200 704" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.8;rx:8;ry:8}
      .panel{stroke-width:2;rx:12;ry:12}
      .t{font-family:'Times New Roman','DejaVu Serif',serif;fill:#0f172a;text-anchor:middle}
      .h{font-size:35px;font-weight:700}
      .m{font-size:29px}
      .s{font-size:23px}
      .xs{font-size:20px}
      .math{font-style:italic}
      .badge{font-family:'Times New Roman','DejaVu Serif',serif;fill:#fff;font-size:31px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
      .arrow{stroke:#0f172a;stroke-width:2.8;fill:none;marker-end:url(#arrow)}
      .thin{stroke:#0f172a;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="704" fill="#fff"/>

  <!-- Inputs -->
  <rect class="box" x="18" y="150" width="120" height="88"/>
  <text class="t m" x="78" y="186"><tspan x="78">User</tspan><tspan x="78" dy="30">Request</tspan></text>
  <rect class="box" x="18" y="275" width="120" height="88"/>
  <text class="t m" x="78" y="311"><tspan x="78">Tool</tspan><tspan x="78" dy="30">Registry</tspan></text>

  <!-- 1. Plan generation -->
  <rect x="165" y="92" width="245" height="320" fill="#eef6ff" stroke="#5b8db8" class="panel"/>
  <circle cx="288" cy="92" r="27" fill="#466f93"/>
  <text class="badge" x="288" y="92">1</text>
  <text class="t h" x="288" y="142">Plan Generation</text>
  <rect class="box" x="195" y="190" width="185" height="72"/>
  <text class="t m" x="288" y="236">Tool Selection</text>
  <rect class="box" x="195" y="290" width="185" height="82"/>
  <text class="t m" x="288" y="323"><tspan x="288">Dependency</tspan><tspan x="288" dy="30">Construction</tspan></text>

  <!-- Initial plan -->
  <rect class="box" x="438" y="205" width="112" height="118"/>
  <text class="t m" x="494" y="242"><tspan x="494">Initial</tspan><tspan x="494" dy="30">Plan</tspan><tspan x="494" dy="31" class="math">W</tspan></text>

  <!-- 2. Risk assessment -->
  <rect x="580" y="72" width="395" height="365" fill="#fff8e9" stroke="#b68a49" class="panel"/>
  <circle cx="778" cy="72" r="27" fill="#b08343"/>
  <text class="badge" x="778" y="72">2</text>
  <text class="t h" x="778" y="122">Risk Assessment</text>

  <rect class="box" x="610" y="162" width="335" height="150"/>
  <text class="t m" x="778" y="198">Execution Conditions</text>
  <text class="t s" x="778" y="238"><tspan x="778">Schema Type · Semantic Type · Unit</tspan><tspan x="778" dy="30">Reference Frame · Freshness</tspan><tspan x="778" dy="30">Confidence · Provenance</tspan></text>

  <rect class="box" x="610" y="335" width="335" height="75"/>
  <text class="t m" x="778" y="366"><tspan x="778">Risk Estimation</tspan><tspan x="778" dy="31" class="math">Dᵢⱼ, Rᵢⱼ, R(W)</tspan></text>

  <!-- Decision -->
  <polygon points="1052,186 1124,258 1052,330 980,258" fill="#f8fbff" stroke="#475569" stroke-width="2"/>
  <text class="t m math" x="1052" y="266">R(W) &gt; θ?</text>

  <!-- Final plan -->
  <rect class="box" x="1090" y="385" width="92" height="82"/>
  <text class="t m" x="1136" y="421"><tspan x="1136">Final</tspan><tspan x="1136" dy="30">Plan</tspan></text>

  <!-- 3. Selective repair -->
  <rect x="675" y="495" width="420" height="170" fill="#fff0f2" stroke="#c97985" class="panel"/>
  <circle cx="885" cy="495" r="27" fill="#bb6170"/>
  <text class="badge" x="885" y="495">3</text>
  <text class="t h" x="885" y="543">Selective Repair</text>
  <rect class="box" x="705" y="575" width="118" height="62"/>
  <text class="t s" x="764" y="600"><tspan x="764">Candidate</tspan><tspan x="764" dy="25">Generation</tspan></text>
  <rect class="box" x="835" y="575" width="128" height="62"/>
  <text class="t s" x="899" y="600"><tspan x="899">Residual Risk</tspan><tspan x="899" dy="25">+ Cost</tspan></text>
  <rect class="box" x="975" y="575" width="90" height="62"/>
  <text class="t s" x="1020" y="600"><tspan x="1020">Select</tspan><tspan x="1020" dy="25" class="math">r*</tspan></text>

  <!-- Main flow -->
  <path class="arrow" d="M138 194 H165"/>
  <path class="arrow" d="M138 319 H165"/>
  <path class="arrow" d="M410 252 H438"/>
  <path class="arrow" d="M550 264 H580"/>
  <path class="arrow" d="M975 258 H980"/>

  <!-- Branches -->
  <path class="arrow" d="M1124 258 H1168 V385 H1136"/>
  <text class="t s" x="1150" y="242">No</text>
  <path class="arrow" d="M1052 330 V495"/>
  <text class="t s" x="1080" y="417">Yes</text>

  <!-- Repair flow -->
  <path class="thin" d="M823 606 H835"/>
  <path class="thin" d="M963 606 H975"/>

  <!-- Re-check and final output -->
  <path class="arrow" d="M1020 575 V548 H650 V410"/>
  <text class="t xs" x="830" y="532">Re-check</text>
  <path class="arrow" d="M1095 606 H1136 V467"/>
</svg>