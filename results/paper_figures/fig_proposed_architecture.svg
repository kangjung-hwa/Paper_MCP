      .h { font-size:29px; font-weight:700; }
      .m { font-size:24px; }
      .s { font-size:17px; }
      .math { font-style:italic; }
      .arrow { stroke:#0f172a; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .line { stroke:#0f172a; stroke-width:2; fill:none; }
      .badgeText { font-family:'DejaVu Serif',serif; fill:white; font-size:30px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    </style>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L10,4 z" fill="#0f172a"/>
