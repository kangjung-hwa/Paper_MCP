name: Reproduce experiments

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "configs/**"
      - "requirements.txt"
      - ".github/workflows/reproduce-experiments.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Generate datasets and run core experiments
        run: |
          for seed in 42 123 2026; do
            python scripts/generate_tasks.py --seed "$seed"
            for method in react schema_aware strict proposed; do
              python scripts/run_experiment.py --config configs/experiment.yaml --method "$method" --seed "$seed"
            done
          done

      - name: Run ablation experiments
        run: python scripts/run_ablation.py

      - name: Generate v3 summary CSV and JSON files
        run: python scripts/aggregate_results.py

      - name: Run operational-validity evaluation and figures
        run: python scripts/run_operational_validity.py

      - name: Run v4.1 external baselines and figures
        run: python scripts/run_external_baselines_v4_1.py

      - name: Upload experiment outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-mcp-experiment-results-${{ github.run_id }}
          path: |
            results/v3/raw/
            results/v3/summary/
            results/v3_operational_validity/
            results/v4_1_external_baselines/
          if-no-files-found: warn
          retention-days: 30
