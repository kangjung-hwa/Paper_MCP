name: Render architecture PNG

on:
  push:
    paths:
      - "results/paper_figures/fig_proposed_architecture.svg"
      - ".github/workflows/render-figure-png.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render PNG from current SVG
        run: |
          rsvg-convert \
            -o results/paper_figures/fig_proposed_architecture.png \
            results/paper_figures/fig_proposed_architecture.svg

      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper_figures/fig_proposed_architecture.png
          if git diff --cached --quiet; then
            echo "PNG already up to date"
          else
            git commit -m "Render architecture PNG from SVG"
            git push
          fi
